[project]
name = "playlist-bridge"
version = "0.1.0"
description = "Migrate playlists between music platforms (currently YouTube Music -> Spotify)."
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.23",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
playlist-bridge = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
